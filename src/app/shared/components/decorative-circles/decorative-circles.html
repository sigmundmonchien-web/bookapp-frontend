<div class="decor-container" [attr.data-preset]="preset()" aria-hidden="true">
  <div class="decor-circle circle-1"></div>
  <div class="decor-circle circle-2"></div>
  <div class="decor-circle circle-3"></div>
  @if (preset() === 'home' || preset() === 'similar-users' || preset() === 'profile') {
  <div class="decor-dot"></div>
}
</div>
