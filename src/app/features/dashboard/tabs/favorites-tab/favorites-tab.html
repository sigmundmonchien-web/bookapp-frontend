@if (loading()) {
  <div class="loading-container">
    <div class="spinner" aria-label="Chargement"></div>
  </div>
} @else if (hasError()) {
  <div class="error-container">
    <p class="error-message">Impossible de charger tes favoris. Réessaie dans un instant.</p>
    <button type="button" class="retry-button" (click)="retry()">
      Réessayer
    </button>
  </div>
} @else if (isEmpty()) {
  <app-empty-state
    icon="♥"
    title="Aucun favori pour l'instant"
    message="Ajoute des livres à tes favoris depuis leur fiche pour les retrouver ici."
  />
} @else {
  <div class="list">
    @for (favorite of favorites() ?? []; track favorite.id) {
      <app-book-list-item [book]="favorite.book">
        <span class="added-date">Ajouté le {{ formatDate(favorite.createdAt) }}</span>
        <button
          type="button"
          class="delete-button"
          (click)="onDeleteClick($event, favorite.id)"
          [attr.aria-label]="'Retirer ' + favorite.book.title + ' des favoris'"
        >
          🗑
        </button>
      </app-book-list-item>
    }
  </div>
}
