@if (loading()) {
  <div class="loading-container">
    <div class="spinner" aria-label="Chargement"></div>
  </div>
} @else if (hasError()) {
  <div class="error-container">
    <p class="error-message">Impossible de charger ta liste à lire. Réessaie dans un instant.</p>
    <button type="button" class="retry-button" (click)="retry()">
      Réessayer
    </button>
  </div>
} @else if (isEmpty()) {
  <app-empty-state
    icon="🔖"
    title="Ta liste à lire est vide"
    message="Ajoute les livres que tu veux découvrir plus tard."
  />
} @else {
  <div class="list">
    @for (item of readingList(); track item.id) {
      <app-book-list-item [book]="item.book">
        <span class="date">Ajouté le {{ formatDate(item.createdAt) }}</span>
        <button
          type="button"
          class="delete-btn"
          (click)="onDeleteClick($event, item.id)"
          [attr.aria-label]="'Retirer ' + item.book.title + ' de la liste à lire'"
        >
          <svg lucideTrash2 size="16" aria-hidden="true"></svg>
        </button>
      </app-book-list-item>
    }
  </div>
}
